  ### Control de Cambios

  - Versión: 1.0 - 10-feb-2023
      - Primera versión

  ### Proyecto Camercloud Colombia

  La guía oficial de uso del API del producto se encuentra publicada en la siguiente dirección:

  [https://doc.viafirma.com/viafirma-fortress/integration/latest/](https://doc.viafirma.com/viafirma-fortress/integration/latest/)

  En esta colección postman **se acotan los casos de uso identificados para el proyecto de integración** con el objetivo de optimizar los tiempos de la fase de primera integración.

  ### Estructura de la documentación

  Cada caso de uso incorpora una descripción individual con explicación de los métodos y atributos utilizados en cada caso.

  En la descripción de la colección se incluye la versión y fecha, debiendo tenerla en cuenta ante futuros cambios que se soliciten, por ejemplo, para agregar más casos de uso identificados en las necesidades del proyecto.

  ### Uso de datos sensibles

  Se hace uso de variables de colección, que son persistidas automáticamente a partir de las distintas responses obtenidas en cada caso.

  Estas variables de colección pueden ser editadas en las propiedades de la colección.

  IMPORTANTE: no se deben usar datos sensibles o contraseñas reales que puedan ser exportadas en esta colección. El uso de datos privados o sensibles debe configurarse en la columna "CURRENT VALUE", y nunca en la columna "INIT VALUE", siendo esta última la que se exporte junto a sus valores cuando se desee compartir esta colección.
