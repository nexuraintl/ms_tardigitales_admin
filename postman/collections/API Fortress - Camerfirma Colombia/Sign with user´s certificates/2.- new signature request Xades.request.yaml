$kind: http-request
description: |-
  ### NUEVA SOLICITUD DE FIRMA

  ```
  {{url}}/api/v1/signature
  ```

  En esta solicitud definiremos las propiedades de la firma, el documento o documentos que deben ser firmados,
   y otras propiedades opcionales que explicamos a continuación.

  Este método POST recibe un JSON con la siguiente estructura:

  ```json
   {
      "redirectUri": "string",
      "signatureConfigurations": [{
          "userCode" : "string",
          "ref" : "string",
          "signatureType": "string",
          "signatureAlgorithm": "string",
          "packaging": "string",
          "document": {
              "name": "string",
              "url": "string"
          },
          "padesConfiguration": {
              "stamper": {
                  "type": "string",
                  "page": 0,
                  "xAxis": 0,
                  "yAxis": 0
              }
          }
      }]

  }
  ```

  Donde:

  * **redirectUri**: URL a la que será redirigido el usuario tras autorizar el uso de su certificado, es decir, ha superado el 
  factor de protección que se haya establecido en sus políticas de uso. 

  **signatureConfigurations**

  * **userCode**: (opcional) puedes fijar el identificador del usuario que debe firmar; este código suele estar asociado al DNI 
  o similar. Al hacerlo, la pantalla que interactúa con el usuario NO le solicitará este dato, omitiendo un paso en el proceso de firma 
  y optimizando con ello los tiempos. En caso de no hacer uso de este atributo, el usuario debe indicarlo en el primer paso 
  del proceso de autorización del uso de su certificado.
  * **ref**: (opcional) puedes indicar cualquier referencia a tu proceso de negocio, por ejemplo, número de expediente, contrato, etc. 
  Si lo usas lo mantendremos durante todo el ciclo de vida de la solicitud, pudiendo ser consultado por métodos del API.
  signatureType: define el formato de firma, y los valores admitidos son: PADES_B, PADES_T, PADES_LTA. NOTA: para uso de formatos 
  que requieran el uso obligatorio de sello de tiempo debes incorporar en la política de firma una configuración de uso de 
  la TSA autorizada, como mínimo, URL, y en caso de estar securizada, usuario/contraseña, o certificado. 
  * **signatureAlgorithm**: define el algoritmo de firma, por defecto, 'RSA_SHA256'.
  * **packaging**: define la envoltura del formato, por defecto, 'ENVELOPED'.

  **document**

  * **document**: el documento o documentos que van a ser firmados pueden definirse de dos formas: pasándolo directamente en el payload en base64 
  o referenciado en una URI. Para cada caso el atributo que define el tipo de uso se explica a continuación:

  * **name**: (opcional) define el nombre de documento firmado

  * **bytesB64**: documento codificado en base64. 
  * **url**: documento disponible en una URI. Opción recomendada para el envío de un paquete numeroso de documentos para evitar superar 
  límites en la longitud de la request que pudieran establecer los distintos elementos de seguridad de la red WAF, Proxies, etc.


  **padesConfiguration**

  stamper: (opcional) objeto que te permite diseñar la representación gráfica de la firma que será impresa sobre el PDF 
  y asociada como anotación de la firma. Las opciones de cofiguración son las siguientes:

  * **type**: 'QR_BARCODE128' combinación de código QR + Barcode128.
  * **page**: indica el número de la página en la que se insertará; además puedes usar '0' para todas las páginas, y '-1' para la última.
  * **xAxis**: coordenadas X donde compienza el vértice superior izquierdo del objeto.
  * **yAxis**: coordenadas Y donde compienza el vértice superior derecho del objeto.

  ### Response

  Como respuesta este servicio devolverá un JSON con la siguiente estructura:

  ```
  {
      "authCode": "string",
      "exeCode": "string"
  }
  ```
  Donde:

  * **authCode**: código que necesitaremos métodos de autenticación de usuarios con certificado digital.
  * **exeCode**: código que necesitaremos para ejecutar una firma previamente autorizada.

  NOTA: en esta colección postman de ejemplo ambos atributos son persistidos automáticamente como variables de la colección. En este caso de uso necesitaremos el atributo ``exeCode``` para CONSTRUIR la URL al que el usuario final debe ser redirigido para autorizar el uso de su certificado para la firma, y tendrá el siguiente formato.

  ```
  {url}/oauth2/v1/auth?signature_code={authCode}&scope=signature&client_id={clientId}&redirect_uri={redirect_uri}
  ```

  Ejemplo:

  https://sandbox.viafirma.com/fortress/oauth2/v1/auth?signature_code=dc01aba568af4d84a7128f3bec24f491&scope=signature&client_id=camerFirma_colombia&redirect_uri=http://localhost:8080/fortress_response

  **IMPORTANTE PARA LA EJECUCIÓN DEL CASO 3**

  Tras la finalización de la ejecución de este caso de uso número 2 (y 2b), copiar la URL mostrada en la consola. En ella se pinta una URL de autorización que debe copiarse para abrirla en un navegador web. Con ella, el usuario podrá autorizar el uso de su certificado que será usado para la firma. De igual forma podrá visualizar el PDF que se dispone a firmar.

  Tras finalizar la autorización, el navegador hará redirect a la URL que se haya definido en la solicitud; aun siendo esta una URL mock, provocando con ello un error en el navegador, el proceso de autorización ha finalizado correctamente.

  Solo a partir de ese momento se podrán ejecutar los siguientes casos de uso 4 y 5.

  NOTA: en esta colección postman la URL la construimos automáticamente a partir del authCode obtenido y la imprimimos por Consola para facilitar las pruebas.
url: "{{url}}/api/v1/signature"
method: POST
headers:
  Authorization: Bearer {{access_token}}
  Content-Type: application/json
body:
  type: text
  content: "{\r

    \    \"redirectUri\": \"{{redirect_uri}}\",\r

    \    \"signatureConfigurations\": [{\r

    \        \"userCode\" : \"{{user_code}}\",\r

    \        \"ref\" : \"{{myExp_reference}}\",\r

    \        \"signatureType\": \"XADES_B\",\r

    \        \"signatureAlgorithm\": \"RSA_SHA256\",\r

    \        \"packaging\": \"ENVELOPED\",\r

    \        \"document\": {\r

    \            \"name\": \"contrato.xml\",\r

    \            \"bytesB64\": \"\"\r

    \        }\r

    \    }]\r

    \r

    }"
scripts:
  - type: afterResponse
    code: |
      pm.test(
          "Retrieve access token",
          function() {
              pm.response.to.have.status(200);
              const responseJson = pm.response.json();
              pm.expect(responseJson.authCode).to.be.a("string");
              pm.collectionVariables.set("authCode", responseJson.authCode);
              pm.environment.set("auth_code",responseJson.authCode);
              pm.expect(responseJson.exeCode).to.be.a("string");
              pm.collectionVariables.set("exeCode", responseJson.exeCode);
              pm.environment.set("exec_code",responseJson.exeCode);

              console.info('***************************************');
              console.info('TEST for case 2.- new signature request');
              console.info('***************************************');
              console.info('authCode = ' +  pm.collectionVariables.get("authCode"));
              console.info('exeCode = ' +  pm.collectionVariables.get("exeCode"));

              console.info('URL WHERE END USER MUST BE REDIRECTED');
              console.info('**************************************');
              console.info(pm.environment.get("url")+"/oauth2/v1/auth?signature_code="+pm.collectionVariables.get("authCode")+"&scope=signature&client_id="+pm.collectionVariables.get("clientId")+"&redirect_uri="+pm.environment.get("redirect_uri"));


          }
      );
    language: text/javascript
order: 3000
